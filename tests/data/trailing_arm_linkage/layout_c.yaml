type: trailing_arm
# Layout C: chassis rocker, shock to arm. Test fixture: the Aurora arm with a rocker linkage
# designed in side view (y = 100) by an independent planar solver.
side: center
name: "Aurora rear, layout C: chassis rocker, shock to arm"
version: "0.1.0"   # major = functional release, minor = new feature, patch = fix
units: millimeters


config:
  steering:
    type: none
  wheel:
    offset: 23.737   # ET: wheel centreline to hub face, along the axle axis
    tire:
      aspect_ratio: 0.8
      section_width: 95
      rim_diameter: 16   # inches
      loaded_radius: 278.5
  cg_position: {x: -627.2, y: -39.844, z: 320}
  wheelbase: 2240.00
  axle_position: rear
  driven_axle: rear
  drive_torque_reaction: unsprung   # hub motor
  front_brake_bias: 0.7             # anti-dive geometry only; the force solve ignores it

# Centreline arm: it carries the axle directly, so axle_inboard IS the moving arm
# point and trailing_arm_outboard must not be authored. Pivot axis must be transverse.
spring:
  type: coilover
  base: arm
actuation:
  type: pushrod_rocker
  rocker_mount: chassis

hardpoints:
  trailing_arm_pivot_a: {x: -1865, y: 130, z: 278.5}
  trailing_arm_pivot_b: {x: -1865, y: 0, z: 278.5}
  axle_inboard: {x: -2240, y: 70.332, z: 278.5}
  axle_outboard: {x: -2240, y: -23.737, z: 278.5}
  rocker_axis_a: {x: -1913.4, y: 80, z: 450.2}
  rocker_axis_b: {x: -1913.4, y: 120, z: 450.2}
  pushrod_outboard: {x: -1955.8, y: 100, z: 294.6}   # on the arm
  pushrod_inboard: {x: -1994.5, y: 100, z: 439.2}
  strut_bottom: {x: -1886.6, y: 100, z: 372.7}   # on the rocker
  strut_top: {x: -2094.4, y: 100, z: 315.9}   # on the arm
