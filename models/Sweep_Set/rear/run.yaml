# ==========================================================================
# rear/run.yaml - the rear sweep set
#
#   uv run python models/Sweep_Set/run_all.py --config models/Sweep_Set/rear/run.yaml
#
# PRECEDENCE, highest first:
#
#   1. command-line flags   (this invocation only; see RUNNING.md or --help)
#   2. THIS FILE            (run.yaml)
#   3. the sweep YAML       (sweeps/NN_*.yaml)
#
# Aurora's rear is a SINGLE CORNER, so its ranges take the bare [start, stop]
# form rather than the axle's {left:, right:}, and it is reported by
# susreport_rear.py rather than susreport.py.
# ==========================================================================
version: 1

# ---- identity and paths --------------------------------------------------
# `name` names the output and report folders, so the same sweep set can be
# pointed at another car without collisions:
#   <geometry folder>/outputs/<name>/   and   <geometry folder>/report/<name>/
name: rear

geometry: ../../aurora/rear.yaml   # default target; --geometry overrides
sweeps_dir: sweeps                 # relative to this file
reporter: susreport_rear           # susreport = axle, susreport_rear = corner
side: null                         # a corner has only one; null for a corner

#Number of CPU Cores to run the sweeps. Auto is min(8, CPU cores).
#Report and animations are built in serial after.
jobs: auto

# ---- Decimals for report.md --------------------------------------
decimals:
  mm: 3
  deg: 4
  ratio: 4
  percent: 2

# ---- report --------------------------------------------------------------
report:
  joints: true           # bearing misalignment. Needs a `joints:` block in the geometry
  notes: true            # conventions + degenerate-geometry notes. Options: True / False
  plots: auto            # Master Overide of all plots. Options: Auto / True / False
  gifs: auto             # Master Overide of all animations. Options: Auto / True / False

# ---- solver health -------------------------------------------------------
#   off   - report every row as solved, no checking
#   warn  - name the bad steps and drop them from min/max/range; they stay in the CSV
#   fail  - non-zero exit, no report written
solver:
  on_bad_solve: warn
  residual_limit: 1.0e-5

# ---- animation settings --------------------------------------------------
gif:
  fps: 20

# ==========================================================================
# Per-sweep settings. Key reference in RUNNING.md.
# ==========================================================================
sweeps:

  # -- 01 bump / droop -----------------------------------------------------
  # TODO: set these ranges from 02 once the real damper stroke is known.
  01_bump:
    run: true
    report: true
    plots: all
    gif: true
    steps: 41
    travel: [-40, 60]      # corner form: no left/right

  # -- 02 damper stroke ----------------------------------------------------
  # Read the usable wheel travel off this, then write it into 01 above.
  02_damper_stroke:
    run: true
    report: true
    plots: [motion_ratio]
    gif: false
    steps: 41
    damper: [-30, 30]
