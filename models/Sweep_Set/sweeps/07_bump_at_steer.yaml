# 07 - BUMP SWEEP WITH THE WHEELS STEERED (rack +20 mm)
# Bump steer measured straight-ahead is not the bump steer you get mid-corner.
# Diff the toe curve here against 01 to see how much it degrades under steer.
version: 1
steps: 65
targets:
  - type: point
    point: wheel_center
    side: left
    direction: {axis: z}
    mode: relative
    start: -55.88 #Define Droop in mm from neutral
    stop: 50.063 #Define Bump in mm from neutral
  - type: point
    point: wheel_center
    side: right
    direction: {axis: z}
    mode: relative
    start: -55.88 #Define Droop in mm from neutral
    stop: 50.063 #Define Bump in mm from neutral
  - type: actuator_position
    actuator: rack
    direction: {axis: y}
    mode: relative
    start: 20
    stop: 20
