# 01 - PARALLEL BUMP / DROOP (heave)
# Both wheels move together, rack centred.
# Gives: camber curve, bump steer, caster/KPI change, track change,
# motion ratio, roll-centre height vs ride, anti-dive/anti-lift.
version: 1
steps: 65
targets:
  - type: point
    point: wheel_center
    side: left
    direction: {axis: z}
    mode: relative
    start: -63.5 #Define Bump Range in mm
    stop: 63.5 #Define Bump Range in mm
  - type: point
    point: wheel_center
    side: right
    direction: {axis: z}
    mode: relative
    start: -63.5 #Define Bump Range in mm
    stop: 63.5 #Define Bump Range in mm
  - type: actuator_position
    actuator: rack
    direction: {axis: y}
    mode: relative
    start: 0
    stop: 0