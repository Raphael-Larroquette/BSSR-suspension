type: double_wishbone
scope: axle
name: "CV3"
version: "3.0.0"   # major = functional release, minor = new feature, patch = fix
units: millimeters

vehicle_config:
  cg_position: {x: -636.45, y: 2.91, z: 346.23} #From gen13 mass budget as of 11/20/2026 at 20:14 on tab B13 V3
  wheelbase: 2285.00

axle_config:
  axle_position: front
  steering:
    type: rack
  actuation:
    type: direct
    mount: lower_wishbone
  spring:
    type: coilover
  anti_roll:
    type: none
  heave_link:
    type: none
  wheel:   # Enlighten tyre, 95/80R16
    offset: 23.737   # ET: wheel centreline to hub face, measured along the axle axis
    tire:
      aspect_ratio: 0.8   # sidewall height / section width = 76 / 95
      section_width: 95
      rim_diameter: 16    # inches
      loaded_radius: 278.5

hardpoints:
  left:
  # Lower wishbone.
    lower_wishbone_inboard_front: {x: 90, y: 265.487, z: 144.815}
    lower_wishbone_inboard_rear: {x: -100, y: 265.487, z: 144.815}
    lower_wishbone_outboard: {x: 23.145, y: 456.026, z: 132.369}

  # Upper wishbone.
    upper_wishbone_inboard_front: {x: 30, y: 229.603, z: 487.845}
    upper_wishbone_inboard_rear: {x: -120, y: 229.603, z: 487.845}
    upper_wishbone_outboard: {x: -31.647, y: 393.327, z: 478.308}

  # Track rod (inner / outer steering rod ends).
    trackrod_inboard: {x: -138.615, y: 210.782, z: 550.99}
    trackrod_outboard: {x: -114.127, y: 370.451, z: 541.943}

  # Axle axis. axle_outboard is where the axis meets the hub mounting face;
  # axle_inboard is any second point on the same axis, ~100-200 mm inboard.
    axle_inboard: {x: 0.0, y: 403.737, z: 278.5}
    axle_outboard: {x: 0.0, y: 503.737, z: 278.5}

  # Outboard coilover: bottom mount on the LCA, top mount on the chassis.
    strut_bottom: {x: 0, y: 401.809, z: 164.763}
    strut_top: {x: 0, y: 281.003, z: 454.144}
  # No `right:` block, so the left corner is mirrored through Y = 0.


# Bearing misalignment outputs only. Not read by the force solve. See docs/reference/geometry.md (joints).
joints:
  # Inboard Controll arm joints ignored for now

  # Outboard ball joints: pressed into a fully located arm, bore on the steering axis.
  lower_wishbone_outboard:
    label: "LBJ"
    type: spherical
    bore:
      part: upright
      axis: {from: lower_wishbone_outboard, to: upper_wishbone_outboard}
    housing:
      part: lower_wishbone
      axis: centred
  upper_wishbone_outboard:
    label: "UBJ"
    type: spherical
    bore:
      part: upright
      axis: optimize
    housing:
      part: upper_wishbone
      axis: centred

  # Track rod and damper body are two-point members: their spin is undetermined,
  # so the housing is `indeterminate` and the report gives a band. Size against locked.
  trackrod_outboard:
    label: "Outer Tie Rod End"
    type: rod_end
    bore: 
      part: upright
      axis: optimize
    housing: 
      part: track_rod
      axis: indeterminate
  trackrod_inboard:
    label: "Inner Tie Rod End"
    type: rod_end
    bore: 
      part: chassis
      axis: {chassis_axis: x} #alternatively could be chassis z or alternative but not decided yet
    housing: 
      part: track_rod
      axis: indeterminate