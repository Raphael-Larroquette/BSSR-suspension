# Static force solve. Reference: docs/reference/forces.md
# Load cases are shared (Working/cases.csv, passed as --cases by run_all.py).
version: "0.1.0"

vehicle:
  mass: 285.0   # kg, as raced incl. driver; point mass at cg_position
  g: 9.80665
  # Sprung/unsprung split and front wheel rate, read only by the quasi-static
  # corner sweep (front run.yaml).
  # PLACEHOLDERS - not measured. Replace with the mass budget before trusting the sweep.
  sprung_mass: 253.0          # kg, excludes every wheel and suspension part
  unsprung_mass_front: 10.0   # kg, per front wheel
  unsprung_mass_rear: 12.0    # kg, the rear wheel
  wheel_rate_front: 17.0      # N/mm, vertical at one front wheel centre, constant

geometry:
  front: front.yaml
  rear: rear.yaml

solve:
  moment_reference: centroid
  pivot_axial:
    default: even
    overrides: {}           # e.g. {Lower Wishbone: lower_wishbone_inboard_front}
  rack: grounded
  brake_torque_reaction: unsprung
  on_wheel_lift: report
  tolerances:
    rank: 1.0e-9
    residual: 1.0e-8

structure:
  weld:
    - ["Upright", "Axle", "Wheel"]
    - ["Semi-Trailing Arm", "Semi-Trailing Arm Carrier", "Axle", "Wheel"]
  attach: []
  ground: ["Steering Rack"]
  ignore: []

output:
  frame: vehicle
  moments: auto
  per_part_files: false
  chassis: true                # Front / Rear Chassis blocks: force on the chassis
