type: double_wishbone
scope: axle
name: "Aurora Front Axle Recreated"
version: "0.1.2"   # major = functional release, minor = new feature, patch = fix
units: millimeters

vehicle_config:
  cg_position: {x: -693.5, y: -11.7, z: 350} #CG z is arbitrtay because gen 12 mass budget calculated of 308 is unrealistic
  wheelbase: 2240.00

axle_config:
  axle_position: front
  steering:
    type: rack
  actuation:
    type: direct
    mount: lower_wishbone
  spring:
    type: coilover
  anti_roll:
    type: none
  heave_link:
    type: none
  wheel:   # Enlighten tyre, 95/80R16
    offset: 23.737   # ET: wheel centreline to hub face, measured along the axle axis
    tire:
      aspect_ratio: 0.8   # sidewall height / section width = 76 / 95
      section_width: 95
      rim_diameter: 16    # inches
      loaded_radius: 278.5

hardpoints:
  left:
  # Lower wishbone.
    lower_wishbone_inboard_front: {x: 60, y: 249.789, z: 207}
    lower_wishbone_inboard_rear: {x: -100.212, y: 249.789, z: 207}
    lower_wishbone_outboard: {x: 15.459, y: 392.38, z: 207.766}

  # Upper wishbone.
    upper_wishbone_inboard_front: {x: 40, y: 235.389, z: 511.839}
    upper_wishbone_inboard_rear: {x: -107.873, y: 235.389, z: 511.839}
    upper_wishbone_outboard: {x: -39.35, y: 333.020, z: 518.603}

  # Track rod (inner / outer steering rod ends).
    trackrod_inboard: {x: -150, y: 229.482, z: 532.985}
    trackrod_outboard: {x: -126.172, y: 324.81, z: 540.025}

  # Axle axis. axle_outboard is where the axis meets the hub mounting face;
  # axle_inboard is any second point on the same axis, ~100-200 mm inboard.
    axle_inboard: {x: 0, y: 405.893, z: 278.5}
    axle_outboard: {x: 0, y: 447.737, z: 278.5}

  # Outboard coilover: bottom mount on the LCA, top mount on the chassis.
    strut_bottom: {x: 16.487, y: 335.273, z: 209.701}
    strut_top: {x: 16.487, y: 240.576, z: 433.285}

  # No `right:` block, so the left corner is mirrored through Y = 0.

