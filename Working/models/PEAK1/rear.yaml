type: trailing_arm
side: center
name: "PEAK1 Rear"
version: "0.1.0"   # major = functional release, minor = new feature, patch = fix
units: millimeters

spring:
  type: coilover

config:
  steering:
    type: none
  wheel:
    offset: 23.737   # ET: wheel centreline to hub face, along the axle axis
    tire:
      aspect_ratio: 0.8
      section_width: 95
      rim_diameter: 16   # inches
      loaded_radius: 278.5
  cg_position: {x: -627.2, y: -39.844, z: 320}
  wheelbase: 2240.00
  axle_position: rear
  driven_axle: rear
  drive_torque_reaction: unsprung   # hub motor
  front_brake_bias: 0.7             # anti-dive geometry only; the force solve ignores it

# Centreline arm: it carries the axle directly, so axle_inboard IS the moving arm
# point and trailing_arm_outboard must not be authored. Pivot axis must be transverse.
hardpoints:
  trailing_arm_pivot_a: {x: -1865, y: 130, z: 278.5}
  trailing_arm_pivot_b: {x: -1865, y: 0, z: 278.5}
  axle_inboard: {x: -2240, y: 70.332, z: 278.5}
  axle_outboard: {x: -2240, y: -23.737, z: 278.5}
  strut_top: {x: -1901.921, y: 100, z: 546.579}
  strut_bottom: {x: -2139, y: 100, z: 309.5}
