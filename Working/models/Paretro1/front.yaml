type: double_wishbone
scope: axle
name: "Aurora Front Axle Recreated"
version: "0.1.2"   # major = functional release, minor = new feature, patch = fix
units: millimeters

vehicle_config:
  cg_position: {x: -627.2, y: -39.844, z: 320}
  wheelbase: 2240.00

axle_config:
  axle_position: front
  steering:
    type: rack
  actuation:
    type: direct
    mount: lower_wishbone
  spring:
    type: coilover
  anti_roll:
    type: none
  heave_link:
    type: none
  wheel:   # Enlighten tyre, 95/80R16
    offset: 23.737   # ET: wheel centreline to hub face, measured along the axle axis
    tire:
      aspect_ratio: 0.8   # sidewall height / section width = 76 / 95
      section_width: 95
      rim_diameter: 16    # inches
      loaded_radius: 278.5

hardpoints:
  left:
  # Lower wishbone.
    lower_wishbone_inboard_front: {x: 67.37, y: 64.247, z: 130.599}
    lower_wishbone_inboard_rear: {x: -32.63, y: 64.247, z: 130.599}
    lower_wishbone_outboard: {x: 17.37, y: 475.865, z: 137.00}

  # Upper wishbone.
    upper_wishbone_inboard_front: {x: 30.539, y: 314.95, z: 422.12}
    upper_wishbone_inboard_rear: {x: -69.461, y: 314.95, z: 422.12}
    upper_wishbone_outboard: {x: -19.461, y: 423.07, z: 437.00}

  # Track rod (inner / outer steering rod ends).
    trackrod_inboard: {x: -130.049, y: 320.7, z: 549.14}
    trackrod_outboard: {x: -119.83, y: 410.91, z: 525.12}

  # Axle axis. axle_outboard is where the axis meets the hub mounting face;
  # axle_inboard is any second point on the same axis, ~100-200 mm inboard.
    axle_inboard: {x: 0, y: 405.893, z: 278.5}
    axle_outboard: {x: 0, y: 523.737, z: 278.5}

  # Outboard coilover: bottom mount on the LCA, top mount on the chassis.
    strut_bottom: {x: 16.487, y: 335.273, z: 209.701}
    strut_top: {x: 16.487, y: 240.576, z: 433.285}

  # No `right:` block, so the left corner is mirrored through Y = 0.


