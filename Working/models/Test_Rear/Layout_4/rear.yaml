type: trailing_arm
side: center
name: "test"
version: "0.1.0"   # major = functional release, minor = new feature, patch = fix
units: millimeters

spring:
  type: coilover
  base: chassis
actuation:
  type: pushrod_rocker
  rocker_mount: arm

config:
  steering:
    type: none
  wheel:
    offset: 23.737   # ET: wheel centreline to hub face, along the axle axis
    tire:
      aspect_ratio: 0.8
      section_width: 95
      rim_diameter: 16   # inches
      loaded_radius: 278.5
  cg_position: {x: -681.5, y: 2.69, z: 367.86} #CG z is arbitrtay because gen 12 mass budget calculated of 308 is unrealistic
  wheelbase: 2240.00
  axle_position: rear
  driven_axle: rear
  drive_torque_reaction: unsprung   # hub motor
  front_brake_bias: 0.7             # anti-dive geometry only; the force solve ignores it

# Centreline arm: it carries the axle directly, so axle_inboard IS the moving arm
# point and trailing_arm_outboard must not be authored. Pivot axis must be transverse.
hardpoints:
  trailing_arm_pivot_a: {x: -1865, y: 130, z: 278.5}
  trailing_arm_pivot_b: {x: -1865, y: 0, z: 278.5}
  axle_inboard: {x: -2240, y: 70.332, z: 278.5}
  axle_outboard: {x: -2240, y: -23.737, z: 278.5}
  rocker_axis_a: {x: -2019.3, y: 80, z: 306.3}       # on the ARM
  rocker_axis_b: {x: -2019.3, y: 120, z: 306.3}
  pushrod_outboard: {x: -2109.7, y: 100, z: 516.9}   # dogbone's CHASSIS end
  pushrod_inboard: {x: -1961.4, y: 100, z: 368.2}    # dogbone's rocker end
  strut_bottom: {x: -2068.4, y: 100, z: 342.3}
  strut_top: {x: -1974.0, y: 100, z: 511.9}          # on the chassis
