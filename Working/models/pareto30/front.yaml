type: double_wishbone
scope: axle
name: "Pareto 30 Optimized Geometry"
version: "0.1.2"   # major = functional release, minor = new feature, patch = fix
units: millimeters

vehicle_config:
  cg_position: {x: -627.2, y: -39.844, z: 320}
  wheelbase: 2240.00

axle_config:
  axle_position: front
  steering:
    type: rack
  actuation:
    type: direct
    mount: lower_wishbone
  spring:
    type: coilover
  anti_roll:
    type: none
  heave_link:
    type: none
  wheel:   # Enlighten tyre, 95/80R16
    offset: 23.737   # ET: wheel centreline to hub face, measured along the axle axis
    tire:
      aspect_ratio: 0.8   # sidewall height / section width = 76 / 95
      section_width: 95
      rim_diameter: 16    # inches
      loaded_radius: 278.5

hardpoints:
  left:
  # Lower wishbone.
    lower_wishbone_inboard_front: {x: 230.494, y: 299.452, z: 134.953}
    lower_wishbone_inboard_rear: {x: -234.187, y: 299.452, z: 134.953}
    lower_wishbone_outboard: {x: 17.683, y: 476.512, z: 134.484}

  # Upper wishbone.
    upper_wishbone_inboard_front: {x: 248.591, y: 318.87, z: 519.566}
    upper_wishbone_inboard_rear: {x: -132.463, y: 318.87, z: 519.566}
    upper_wishbone_outboard: {x: -29.577, y: 409.29, z: 519.382}

  # Track rod (inner / outer steering rod ends).
    trackrod_inboard: {x: -163.085, y: 318.325, z: 518.443}
    trackrod_outboard: {x: -130.051, y: 408.865, z: 518.269}

  # Axle axis. axle_outboard is where the axis meets the hub mounting face;
  # axle_inboard is any second point on the same axis, ~100-200 mm inboard.
    axle_inboard: {x: 0.0, y: 423.737, z: 278.5}
    axle_outboard: {x: 0.0, y: 523.737, z: 278.5}

  # Outboard coilover: bottom mount on the LCA, top mount on the chassis.
    strut_bottom: {x: 7.304, y: 426.422, z: 184.547}
    strut_top: {x: 7.304, y: 330.652, z: 431.481}

  # No `right:` block, so the left corner is mirrored through Y = 0.

# Bearing misalignment outputs only. Not read by the force solve. See MODELS.md section 5.
joints:
  # Inboard bushes: bore on the pivot axis, so these must read 0.00 deg.
  lower_wishbone_inboard_front:
    label: "LCA Front Bush"
    type: bushing
    bore:
      part: lower_wishbone
      axis: {from: lower_wishbone_inboard_front, to: lower_wishbone_inboard_rear}
  upper_wishbone_inboard_front:
    label: "UCA Front Bush"
    type: bushing
    bore:
      part: upper_wishbone
      axis: {from: upper_wishbone_inboard_front, to: upper_wishbone_inboard_rear}

  # Outboard ball joints: pressed into a fully located arm, bore on the steering axis.
  lower_wishbone_outboard:
    label: "LBJ"
    type: spherical
    bore:
      part: upright
      axis: {from: lower_wishbone_outboard, to: upper_wishbone_outboard}
  upper_wishbone_outboard:
    label: "UBJ"
    type: spherical
    bore:
      part: upright
      axis: {vector: [-6.38, 0.191, 1.081]}
    housing:
      part: upper_wishbone
      axis: centred

  # Track rod and damper body are two-point members: their spin is undetermined,
  # so the housing is `indeterminate` and the report gives a band. Size against locked.
  trackrod_outboard:
    label: "Outer Tie Rod End"
    type: rod_end
    bore: {part: upright, axis: {vector: [-50.284, 16.291, -5.917]}}
    housing: {part: track_rod, axis: indeterminate}
  trackrod_inboard:
    label: "Inner Tie Rod End"
    type: rod_end
    bore: {part: chassis, axis: {chassis_axis: x}}
    housing: {part: track_rod, axis: indeterminate}

  strut_bottom:
    label: "Damper Lower Mount"
    type: spherical
    bore: {part: lower_wishbone, axis: {chassis_axis: x}}
    housing: {part: spring_damper, axis: indeterminate}
  strut_top:
    label: "Damper Upper Mount"
    type: spherical
    bore: {part: chassis, axis: {chassis_axis: x}}
    housing: {part: spring_damper, axis: indeterminate}
