# 07 - BUMP WITH THE WHEELS STEERED. Diff the toe curve against 01.
# Off by default. Turn on when chasing bump steer specifically.
# Ranges and step counts are overridden by run.yaml. See ../../SWEEPS.md.
version: 1
steps: 65
targets:
  - type: point
    point: wheel_center
    side: left
    direction: {axis: z}
    mode: relative
    start: -55.88
    stop: 50.063
  - type: point
    point: wheel_center
    side: right
    direction: {axis: z}
    mode: relative
    start: -55.88
    stop: 50.063
  - type: actuator_position
    actuator: rack
    direction: {axis: y}
    mode: relative
    start: 20
    stop: 20
