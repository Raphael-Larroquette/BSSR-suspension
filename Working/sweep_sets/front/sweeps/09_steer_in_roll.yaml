# 09 - STEERING AT A HELD ROLL ATTITUDE. 04, but at the attitude the car is actually
# in when steered hard. The only sweep where Ackermann-in-roll is defined.
# Ranges and step counts are overridden by run.yaml. See ../../SWEEPS.md.
version: 1
steps: 65
targets:
  - type: point
    point: wheel_center
    side: left
    direction: {axis: z}
    mode: relative
    start: -25
    stop: -25
  - type: point
    point: wheel_center
    side: right
    direction: {axis: z}
    mode: relative
    start: 25
    stop: 25
  - type: actuator_position
    actuator: rack
    direction: {axis: y}
    mode: relative
    start: -35
    stop: 35
