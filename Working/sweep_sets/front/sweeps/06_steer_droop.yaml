# 06 - STEERING AT DROOP. The other end of the 04/05 comparison.
# Ranges and step counts are overridden by run.yaml. See ../../SWEEPS.md.
version: 1
steps: 65
targets:
  - type: point
    point: wheel_center
    side: left
    direction: {axis: z}
    mode: relative
    start: -55
    stop: -55
  - type: point
    point: wheel_center
    side: right
    direction: {axis: z}
    mode: relative
    start: -55
    stop: -55
  - type: actuator_position
    actuator: rack
    direction: {axis: y}
    mode: relative
    start: -35
    stop: 35
