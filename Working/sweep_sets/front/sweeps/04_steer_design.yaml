# 04 - STEERING AT DESIGN RIDE HEIGHT. Rack lock to lock, both wheels at design.
# Ranges and step counts are overridden by run.yaml. See ../../SWEEPS.md.
version: 1
steps: 65
targets:
  - type: point
    point: wheel_center
    side: left
    direction: {axis: z}
    mode: relative
    start: 0
    stop: 0
  - type: point
    point: wheel_center
    side: right
    direction: {axis: z}
    mode: relative
    start: 0
    stop: 0
  - type: actuator_position
    actuator: rack
    direction: {axis: y}
    mode: relative
    start: -35
    stop: 35
