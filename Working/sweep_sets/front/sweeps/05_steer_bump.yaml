# 05 - STEERING AT BUMP. Same rack sweep as 04, both wheels compressed.
# Diff against 04 for how much the steering geometry changes when loaded.
# Ranges and step counts are overridden by run.yaml. See ../../SWEEPS.md.
version: 1
steps: 65
targets:
  - type: point
    point: wheel_center
    side: left
    direction: {axis: z}
    mode: relative
    start: 50
    stop: 50
  - type: point
    point: wheel_center
    side: right
    direction: {axis: z}
    mode: relative
    start: 50
    stop: 50
  - type: actuator_position
    actuator: rack
    direction: {axis: y}
    mode: relative
    start: -35
    stop: 35
