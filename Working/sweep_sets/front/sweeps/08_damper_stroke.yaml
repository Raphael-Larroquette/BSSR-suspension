# 08 - DRIVEN BY DAMPER LENGTH, NOT WHEEL TRAVEL. Commands the damper and reads the
# wheel, which is how you find the travel limits real damper hardware allows.
# No hub_z target, so the analytic deriv_*_wrt_hub_z columns are all NaN here.
# Ranges and step counts are overridden by run.yaml. See ../../SWEEPS.md.
version: 1
steps: 65
targets:
  - type: element_length
    element: damper
    side: left
    mode: relative
    start: -30
    stop: 30
  - type: element_length
    element: damper
    side: right
    mode: relative
    start: -30
    stop: 30
  - type: actuator_position
    actuator: rack
    direction: {axis: y}
    mode: relative
    start: 0
    stop: 0
