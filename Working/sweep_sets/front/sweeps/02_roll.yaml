# 02 - ROLL. Equal and opposite wheel travel, rack centred, zero net heave.
# Ranges and step counts are overridden by run.yaml. See ../../SWEEPS.md.
version: 1
steps: 65
targets:
  - type: point
    point: wheel_center
    side: left
    direction: {axis: z}
    mode: relative
    start: -25
    stop: 25
  - type: point
    point: wheel_center
    side: right
    direction: {axis: z}
    mode: relative
    start: 25
    stop: -25
  - type: actuator_position
    actuator: rack
    direction: {axis: y}
    mode: relative
    start: 0
    stop: 0
