# 10 - CORNER RAMP. Roll and steer build together from straight-and-level to full roll
# at full lock. 09 holds one attitude and sweeps the rack; this sweeps both at once.
# Ranges and step counts are overridden by run.yaml. See ../../SWEEPS.md.
version: 1
steps: 65
targets:
  - type: point
    point: wheel_center
    side: left
    direction: {axis: z}
    mode: relative
    start: 0
    stop: -25
  - type: point
    point: wheel_center
    side: right
    direction: {axis: z}
    mode: relative
    start: 0
    stop: 25
  - type: actuator_position
    actuator: rack
    direction: {axis: y}
    mode: relative
    start: 0
    stop: 35
