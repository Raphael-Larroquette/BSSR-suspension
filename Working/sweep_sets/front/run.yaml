# Front sweep set. Keys: docs/reference/sweeps.md. Channels: docs/reference/characteristics.md.
# Sweeps are generated from this file; CLI flags override it for one run.
version: 1

name: front
geometry: ../../models/aurora/front.yaml   # default; --model / --geometry override
reporter: susreport
side: left

decimals:
  mm: 3
  deg: 4
  ratio: 4
  percent: 2

report:
  joints: true
  notes: true
  plots: auto
  gifs: auto

solver:
  on_bad_solve: warn
  residual_limit: 1.0e-5

gif:
  fps: 20
  dpi: 100
  format: gif

sweeps:

  01_bump_parallel:
    run: true
    report: true
    plots: all
    gif: true
    steps: 22
    travel:
      left: [-55, 50]
      right: [-55, 50]
    rack: [0, 0]

  02_roll:
    run: true
    report: true
    plots: all
    gif: true
    steps: 65
    travel:
      left: [-25, 25]
      right: [25, -25]
    rack: [0, 0]

  # Off: adds nothing to 01 until a cross-axle element (ARB) exists.
  03_single_wheel_bump:
    run: false
    report: true
    plots: all
    gif: false
    steps: 22
    travel:
      left: [-55, 50]
      right: [0, 0]
    rack: [0, 0]

  04_steer_design:
    run: true
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [0, 0]
      right: [0, 0]
    rack: [-35, 35]

  05_steer_bump:
    run: true
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [50, 50]
      right: [50, 50]
    rack: [-35, 35]

  06_steer_droop:
    run: true
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [-55, -55]
      right: [-55, -55]
    rack: [-35, 35]

  # Off: only adds the bump-steer curve shape while steered.
  07_bump_at_steer:
    run: false
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [-55.88, 50.063]
      right: [-55.88, 50.063]
    rack: [20, 20]

  # Usable wheel travel for this damper stroke; set the travel ranges from it.
  08_damper_stroke:
    run: true
    report: [damper_length, wheel_travel_lr, motion_ratio, install_ratio]
    plots: [motion_ratio, install_ratio]
    gif: false
    steps: 65
    damper:
      left: [-30, 30]
      right: [-30, 30]
    rack: [0, 0]

  # Right turn (rack +y): the left wheel is outer, in bump.
  09_steer_in_roll:
    run: true
    report: true
    plots: all
    gif: true
    steps: 65
    travel:
      left: [25, 25]
      right: [-25, -25]
    rack: [0, 35]

  # Right turn, roll and steer ramp together = constant-speed corner. Read by the
  # road_camber objective. Endpoints are placeholders until set from the roll
  # gradient: phi = RG*v^2*delta_max/(g*L), travel = (track/2)*tan(phi).
  10_corner_ramp:
    run: true
    report: true
    plots: all
    gif: true
    steps: 65
    travel:
      left: [0, 25]
      right: [0, -25]
    rack: [0, 35]
