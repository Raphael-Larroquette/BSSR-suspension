# Front sweep set. Keys: docs/reference/sweeps.md. Channels: docs/reference/characteristics.md.
# Sweeps are generated from this file; CLI flags override it for one run.
version: 1

name: front
geometry: ../../models/aurora/front.yaml   # default; --model / --geometry override
reporter: susreport
side: left

decimals:
  mm: 3
  deg: 4
  ratio: 4
  percent: 2

report:
  joints: true
  notes: true
  plots: auto
  gifs: auto

solver:
  on_bad_solve: warn
  residual_limit: 1.0e-5

gif:
  fps: 20
  dpi: 100
  format: gif

sweeps:

  01_bump_parallel:
    run: true
    report: true
    plots: all
    gif: true
    steps: 65
    travel:
      left: [-50.8, 50.8]
      right: [-50.8, 50.8]
    rack: [0, 0]

  02_roll:
    run: false
    report: true
    plots: all
    gif: true
    steps: 65
    travel:
      left: [-25, 25]
      right: [25, -25]
    rack: [0, 0]

  # Off: adds nothing to 01 until a cross-axle element (ARB) exists.
  03_single_wheel_bump:
    run: false
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [-50.8, 50.8]
      right: [0, 0]
    rack: [0, 0]

  04_steer_design:
    run: true
    report: true
    plots: all
    gif: true
    steps: 65
    travel:
      left: [0, 0]
      right: [0, 0]
    rack: [-28, 28]

  05_steer_bump:
    run: true
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [50.8, 50.8]
      right: [50.8, 50.8]
    rack: [-28, 28]

  06_steer_droop:
    run: true
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [-50.8, -50.8]
      right: [-50.8, -50.8]
    rack: [-28, 28]

  # Off: only adds the bump-steer curve shape while steered.
  07_bump_at_steer:
    run: false
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [-50.8, 50.8]
      right: [-50.8, 50.8]
    rack: [28, 28]

  # Usable wheel travel for this damper stroke; set the travel ranges from it.
  08_damper_stroke:
    run: false
    report: [damper_length, wheel_travel_lr, motion_ratio, install_ratio]
    plots: [motion_ratio, install_ratio]
    gif: false
    steps: 65
    damper:
      left: [-30, 30]
      right: [-30, 30]
    rack: [0, 0]

  # Right turn (rack +y): the left wheel is outer, in bump.
  09_steer_in_roll:
    run: false
    report: true
    plots: all
    gif: true
    steps: 65
    travel:
      left: [25, 25]
      right: [-25, -25]
    rack: [0, 28]

  # Quasi-static steady-state corner (Working/sweep_sets/corner.py; keys and
  # assumptions in docs/reference/sweeps.md). For each step of a curvature ramp
  # at constant speed it computes the rack and both wheel travels that hold the
  # car in a steady turn, then solves them like any other sweep. Also writes
  # sweep_outputs/front/10_steady_corner_corner.csv (accelerations, tyre and
  # spring loads per step). Needs the mass split and wheel_rate_front in the
  # model's forces.yaml. Read by the road_camber objective (the optimiser always
  # solves it in fast mode).
  10_steady_corner:
    run: true
    report: true
    plots: all
    gif: true
    corner:
      mode: full                  # full: iterate the solved geometry | fast: roll-centre closed form
      turn: right                 # right: left wheel is outer
      speed: 6.2832 #5.871                  # m/s at the CG, constant. PLACEHOLDER design case
      radius: [131, 8]  #7.5      # m, CG path, start -> end; stepped evenly in 1/R
      steps: 33
      rack_limit: 35              # mm, |rack| the steer table covers
      roll_gravity: true          # CG lateral shift with roll adds to load transfer
      pitch: true                 # forward inertia from the turn centre being behind the CG
      fy_split: load              # front tyre lateral force split: load | equal
      mu: 0.65                     # grip check only (warns above mu*g)
      tolerance: {travel: 0.01, rack: 0.01}   # mm, full-mode convergence
      max_iterations: 25
