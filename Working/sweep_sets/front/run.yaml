# Front sweep set. Key reference: ../RUNNING.md. Channel names: ../CHARACTERISTICS.md.
# THIS FILE IS THE WHOLE SWEEP SET. Each sweep's targets are generated from its
# travel / damper / rack keys and written to outputs/<name>/_resolved_sweeps/ —
# read those to see what was solved, never edit them.
# CLI flags override this file for one invocation; nothing else configures a run.
version: 1

name: front                                # names outputs/<name>/ and report/<name>/
geometry: ../../models/aurora/front.yaml   # default target; --geometry overrides
reporter: susreport                        # susreport = axle, susreport_rear = corner
side: left                                 # which corner the per-corner rows report
jobs: auto                                 # min(8, CPU cores); report and gifs are serial

decimals:
  mm: 3
  deg: 4
  ratio: 4       # mm/mm, deg/deg, deg/mm and unitless
  percent: 2

report:
  joints: true   # bearing misalignment section
  notes: true    # conventions + degenerate-geometry notes
  plots: auto    # master override: auto | true | false
  gifs: auto     # master override: auto | true | false

solver:
  # off = no checking | warn = flag bad steps, drop them from min/max/range | fail = exit
  on_bad_solve: warn
  residual_limit: 1.0e-5   # vs solver_max_residual; healthy Aurora steps are 1e-6 to 5e-6

gif:
  fps: 20        # per-sweep `gif:` mappings merge over this

# Per-sweep settings:
#   run     true | false           false = no CSV, and invisible to the bearing table
#   report  true | false | [list]  true = the preset for that sweep kind
#   plots   all | none | [list]    must be a subset of `report`
#   gif     true | false | {...}   a mapping merges over the top-level gif block
#   steps   int                    points in the sweep
#
# What it drives — every corner exactly once, plus every actuator:
#   travel  {left: [a, b], right: [a, b]}   wheel-centre z, mm from design
#   damper  {left: [a, b], right: [a, b]}   element length, mm from design (not with travel)
#   rack    [a, b]                 rack y, mm from centre; [0, 0] holds it centred
#
#   file    path                   use a hand-written sweep YAML verbatim instead of
#                                  generating one. Not combinable with the keys above.
sweeps:

  # Both wheels together, rack centred. The straight-line reference for camber,
  # bump steer, motion ratio and roll-centre migration.
  01_bump_parallel:
    run: true
    report: true
    plots: all
    gif: true
    steps: 22
    travel:
      left: [-55, 50]
      right: [-55, 50]
    rack: [0, 0]

  # Equal and opposite: the roll attitude of a specific cornering condition,
  # set by the range below. Not a pure-roll abstraction.
  02_roll:
    run: true
    report: true
    plots: all
    gif: true
    steps: 65
    travel:
      left: [-25, 25]
      right: [25, -25]
    rack: [0, 0]

  # OFF: identical to 01 on the left, held on the right. Turn on if the model ever
  # gains a cross-axle element (an anti-roll bar) that couples the two corners.
  03_single_wheel_bump:
    run: false
    report: true
    plots: all
    gif: false
    steps: 22
    travel:
      left: [-55, 50]
      right: [0, 0]
    rack: [0, 0]

  04_steer_design:
    run: true
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [0, 0]
      right: [0, 0]
    rack: [-35, 35]

  05_steer_bump:
    run: true
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [50, 50]
      right: [50, 50]
    rack: [-35, 35]

  06_steer_droop:
    run: true
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [-55, -55]
      right: [-55, -55]
    rack: [-35, 35]

  # OFF: sets no bearing requirement. Its one unique output is the shape of the
  # toe-vs-travel curve while steered. Turn on when chasing bump steer specifically.
  07_bump_at_steer:
    run: false
    report: true
    plots: all
    gif: false
    steps: 65
    travel:
      left: [-55.88, 50.063]
      right: [-55.88, 50.063]
    rack: [20, 20]

  # Driven by damper length instead of wheel travel. Read the usable wheel travel
  # off this, then set the `travel` ranges above to match. Honest motion ratio.
  08_damper_stroke:
    run: true
    report: [damper_length, wheel_travel_lr, motion_ratio]
    plots: [motion_ratio]
    gif: false
    steps: 65
    damper:
      left: [-30, 30]
      right: [-30, 30]
    rack: [0, 0]

  # Lock to lock at a held roll attitude: mid-corner steering geometry, and the only
  # place Ackermann-in-roll is defined.
  # NOTE: roll is held one way while the rack sweeps both, so only half of this is a
  # real cornering state. For the physical half only, set rack: [0, 35].
  09_steer_in_roll:
    run: true
    report: true
    plots: all
    gif: true
    steps: 65
    travel:
      left: [-25, -25]
      right: [25, 25]
    rack: [-35, 35]

  # Roll and steer build together from straight-and-level to full roll at full lock:
  # one line through corner entry rather than a held attitude.
  10_corner_ramp:
    run: true
    report: true
    plots: all
    gif: true
    steps: 65
    travel:
      left: [0, -25]
      right: [0, 25]
    rack: [0, 35]
