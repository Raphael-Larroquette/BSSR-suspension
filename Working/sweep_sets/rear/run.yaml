# Rear sweep set. Key reference: ../RUNNING.md. Channel names: ../CHARACTERISTICS.md.
# Precedence: CLI flags > this file > the sweep YAML in sweeps/.
#
# Aurora's rear is a SINGLE CENTRELINE CORNER, so ranges take the bare [start, stop]
# form and the reporter is susreport_rear. A centreline wheel produces no camber, toe,
# caster, KPI, scrub, trail, half track or front-view swing arm at all — naming them
# under `plots:` will not bring them back.
version: 1

name: rear
geometry: ../../models/aurora/rear.yaml    # default target; --geometry overrides
sweeps_dir: sweeps                         # relative to this file
reporter: susreport_rear                   # susreport = axle, susreport_rear = corner
side: null                                 # null for a corner: it has only one
jobs: auto                                 # min(8, CPU cores); report and gifs are serial

decimals:
  mm: 3
  deg: 4
  ratio: 4
  percent: 2

report:
  joints: true   # needs a `joints:` block in the geometry
  notes: true
  plots: auto    # master override: auto | true | false
  gifs: auto     # master override: auto | true | false

solver:
  # off = no checking | warn = flag bad steps, drop them from min/max/range | fail = exit
  on_bad_solve: warn
  residual_limit: 1.0e-5

gif:
  fps: 20

# Key reference in ../RUNNING.md.
sweeps:

  # TODO: set these ranges from 02 once the real damper stroke is known.
  01_bump:
    run: true
    report: true
    plots: all
    gif: true
    steps: 41
    travel: [-50.8, 50.8]      # corner form: no left/right

  # Read the usable wheel travel off this, then write it into 01 above.
  02_damper_stroke:
    run: true
    report: true
    plots: [motion_ratio]
    gif: false
    steps: 41
    damper: [-30, 30]
