# Rear sweep set. Keys: docs/reference/sweeps.md. Channels: docs/reference/characteristics.md.
# Centreline corner: travel / damper take the bare [start, stop] form, no rack.
version: 1

name: rear
geometry: ../../models/aurora/rear.yaml   # default; --model / --geometry override
reporter: susreport_rear
side: null

decimals:
  mm: 3
  deg: 4
  ratio: 4
  percent: 2

report:
  joints: true
  notes: true
  plots: auto
  gifs: auto

solver:
  on_bad_solve: warn
  residual_limit: 1.0e-5

gif:
  fps: 20
  dpi: 100
  format: gif

sweeps:

  # TODO: set these ranges from 02 once the real damper stroke is known.
  01_bump:
    run: true
    report: true
    plots: all
    gif: true
    steps: 41
    travel: [-50.8, 50.8]

  # Usable wheel travel for this damper stroke.
  02_damper_stroke:
    run: true
    report: true
    plots: [motion_ratio, install_ratio]
    gif: false
    steps: 41
    damper: [-30, 30]
